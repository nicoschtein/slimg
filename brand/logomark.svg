<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Slimg logomark">
  <defs>
    <linearGradient id="slimgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
  <!-- The "squeeze": two chevrons pressing a central bar (the slimmed image) -->
  <g fill="none" stroke="url(#slimgGrad)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="26,28 40,50 26,72"/>
    <polyline points="74,28 60,50 74,72"/>
  </g>
  <rect x="45.5" y="26" width="9" height="48" rx="4.5" fill="url(#slimgGrad)"/>
</svg>
